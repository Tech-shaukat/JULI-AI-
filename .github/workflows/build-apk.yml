name: Build JULI AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Firebase google-services.json is present
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GitHub Secret."
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json! Push app/google-services.json (package com.safalta.julia) to GitHub or add its content as a repository secret named GOOGLE_SERVICES_JSON."
            exit 1
          fi
          if ! grep -q '"com.safalta.julia"' app/google-services.json; then
            echo "::error::app/google-services.json does not contain package_name com.safalta.julia! Please use the google-services.json from this AI Studio project."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare keystores for release & debug signing
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -storepass android -alias upload -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=JULI AI,O=Safalta,C=IN"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Release APK (reCAPTCHA App Check enabled)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle --version
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload JULI AI Release APK
        uses: actions/upload-artifact@v4
        with:
          name: JULI-AI-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload JULI AI Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JULI-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
